name: Ginkgo
options:
  bundleIdPrefix: com.akashy
  deploymentTarget:
    iOS: "17.0"
packages:
  GinkgoCore:
    path: Packages/GinkgoCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 13.2.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 565VGK36PF  # Akash Yallamati (Personal Team); free accounts expire builds after 7 days
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    # Any compiler warning in Ginkgo's own code fails the build (packages are unaffected).
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
targets:
  Ginkgo:
    type: application
    platform: iOS
    sources:
      - path: Ginkgo
      # The sample nightstand data, bundled for "See an example" and demo mode.
      - path: examples
        buildPhase: resources
    # The Firebase config is not committed (see .gitignore), so it is copied in only when
    # present. A fresh clone still builds; AI features then show their unavailable state.
    postBuildScripts:
      - name: Copy Firebase config if present
        script: |
          if [ -f "$SRCROOT/GoogleService-Info.plist" ]; then
            cp "$SRCROOT/GoogleService-Info.plist" "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akashy.ginkgo
        # The copy script reads a file outside the project's declared inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Brand
    info:
      path: Ginkgo/Info.plist
      properties:
        CFBundleDisplayName: Ginkgo
        NSCameraUsageDescription: Ginkgo uses the camera and LiDAR sensor to measure furniture.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies:
      - package: GinkgoCore
      - package: Firebase
        product: FirebaseAILogic
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
  GinkgoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GinkgoTests]
    dependencies:
      - target: Ginkgo
      - package: GinkgoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akashy.ginkgo.tests
  GinkgoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GinkgoUITests]
    dependencies:
      - target: Ginkgo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akashy.ginkgo.uitests
schemes:
  Ginkgo:
    build:
      targets:
        Ginkgo: all
    test:
      targets:
        - GinkgoTests
        - GinkgoUITests
      gatherCoverageData: true
      coverageTargets:
        - Ginkgo
