# Ginkgo lint rules: readable, consistent, no silent crashes. Run by scripts/ci.sh.
included:
  - Ginkgo
  - GinkgoTests
  - GinkgoUITests
  - Packages/GinkgoCore/Sources
  - Packages/GinkgoCore/Tests
excluded:
  - Ginkgo/Models/GinkgoModels.swift   # generated by quicktype; never edited by hand
  - Packages/GinkgoCore/Sources/GinkgoCore/Models/GinkgoModels.swift   # generated by scripts/generate-models.sh
  - Packages/GinkgoCore/.build

disabled_rules:
  - trailing_comma            # trailing commas keep list edits to one line

opt_in_rules:
  - force_unwrapping          # a "!" crash in the app is a bug; tests may use XCTUnwrap instead
  - implicitly_unwrapped_optional
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - redundant_nil_coalescing
  - sorted_first_last
  - vertical_whitespace_closing_braces
  - fatal_error_message

line_length:
  warning: 140
  error: 180
file_length:
  warning: 300
  error: 450
type_body_length:
  warning: 250
  error: 400
function_body_length:
  warning: 50
  error: 80
identifier_name:
  min_length: 1
  excluded: [x, y, z, r, g, b, a, i, k, p, s, t, u, v, w]
