# Runs scripts/ci.sh, the same command run locally. To save runner time it runs only when code
# reaches main or a pull request, and never for docs-only changes. Pushes to other branches wait
# for their pull request. Add [skip ci] to a commit message to skip a run; use "Run workflow"
# on the Actions tab to start one by hand.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'brand/**', 'LICENSE', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'brand/**', 'LICENSE', '.gitignore']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Xcode 27 matches the team's Macs and is needed for Foundation Models + GeminiLanguageModel (iOS 27).
    # macos-latest only has Xcode 26.x, which rejects code Xcode 27 accepts.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tools (versions match the team's Macs)
        run: |
          npm install -g quicktype@26.0.0
          brew install xcodegen
          curl -sSL -o swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          unzip -q swiftlint.zip -d "$HOME/swiftlint" && echo "$HOME/swiftlint" >> "$GITHUB_PATH"

      - name: Pick an iPhone simulator
        run: |
          name=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro)?' | sort -V | tail -1)
          echo "Using $name"
          echo "SIMULATOR=$name" >> "$GITHUB_ENV"

      # Started on its own so a stuck simulator fails here, clearly, instead of looking like slow tests.
      - name: Boot the simulator
        timeout-minutes: 10
        run: |
          xcrun simctl boot "$SIMULATOR" || true
          xcrun simctl bootstatus "$SIMULATOR" -b

      - name: Generate the Xcode project
        run: xcodegen generate

      # Firebase and its dependencies take minutes to download and resolve; keep them between runs.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            build/spm
            Packages/GinkgoCore/.build
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'Packages/GinkgoCore/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      # Locally this takes about 4 minutes; a run this long is stuck, so fail fast and keep the log.
      - name: CI (models, lint, build, tests, coverage)
        timeout-minutes: 20
        env:
          SPM_DIR: build/spm
          # One simulator, no clones: starting clones hung for 17 minutes on the cloud runner (Nov 23).
          PARALLEL: "NO"
        run: scripts/ci.sh

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/ci.xcresult
            build/ci.log
          if-no-files-found: ignore
